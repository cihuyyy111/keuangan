<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1726"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Keuangan</title>
<style>
:root{--bg:#0e1726;--card:#16233a;--tx:#eef2f7;--mut:#8b9bb4;--ac:#1f9d6b;--warn:#e0a526;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:22px;margin:0 0 14px}h2{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.04em;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:16px;padding:14px}
.card small,.mut{color:var(--mut);font-size:13px}.card b{display:block;font-size:19px;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.it{padding:11px 0;border-bottom:1px solid #22324d}.it small{display:block;color:var(--mut);font-size:13px}
.pos{color:var(--ac)}.cat{padding:9px 0}.bar{height:7px;background:#22324d;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}small.warn{color:var(--warn)}small.bad{color:var(--bad)}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px}
dialog{width:100%;max-width:480px;margin:auto 0 0;border:0;border-radius:20px 20px 0 0;background:var(--card);color:var(--tx);padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
dialog::backdrop{background:#0008}input,select,button.s{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #2b3d5c;background:#0e1726;color:var(--tx);font-size:16px}
button.s{background:var(--ac);border:0;font-weight:600}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg label{text-align:center;padding:11px;border-radius:12px;background:#0e1726}
.seg input{display:none}.seg input:checked+span{color:var(--ac);font-weight:700}#t{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:20px;font-size:14px}
</style></head><body>
<div class="row"><h1>Keuangan</h1><span id="cfg" class="mut">⚙︎</span></div>
<div class="grid"><div class="card"><small>Hari ini</small><b id="td">–</b></div><div class="card"><small>Bulan ini</small><b id="mo">–</b></div>
<div class="card"><small>Pemasukan</small><b id="in" class="pos">–</b></div><div class="card"><small>Sisa bulan ini</small><b id="sl">–</b></div></div>
<h2>PER KATEGORI · ketuk untuk atur budget</h2><div id="cats"></div>
<h2>TRANSAKSI HARI INI</h2><div id="list"></div><div id="t" hidden></div>
<button id="fab">+</button>
<dialog id="f"><form method="dialog"><button type="button" class="s" id="scan" style="background:#22324d">📷 Scan struk</button><input id="img" type="file" accept="image/*" capture="environment" hidden><div class="seg"><label><input type="radio" name="jenis" value="Pengeluaran" checked><span>Pengeluaran</span></label><label><input type="radio" name="jenis" value="Pemasukan"><span>Pemasukan</span></label></div>
<input name="jml" type="number" inputmode="numeric" placeholder="Nominal (Rp)" required><input name="nama" placeholder="Catatan / nama item">
<select name="kat"></select><input name="tgl" type="date" required><button class="s">Simpan</button></form></dialog>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),ymd=d=>d.toLocaleDateString('sv-SE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Food & Beverage','Jajan','Transport','Belanja','Tagihan','Kesehatan','Lainnya'];
let cfg=JSON.parse(localStorage.cfg||'{}'),bud=JSON.parse(localStorage.bud||'{}'),rows=JSON.parse(localStorage.rows||'[]');
const toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2500)};
function setup(){cfg.url=prompt('URL Web App Apps Script',cfg.url||'')||cfg.url;cfg.token=prompt('Token',cfg.token||'')||cfg.token;localStorage.cfg=JSON.stringify(cfg);load()}
async function load(){if(!cfg.url)return setup();try{const r=await(await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token)+'&bulan='+ymd(new Date()).slice(0,7))).json();if(!r.ok)throw 0;rows=r.rows;localStorage.rows=JSON.stringify(rows)}catch(e){toast('Offline, menampilkan data terakhir')}render()}
function render(){const td=ymd(new Date()),ex=rows.filter(r=>r.jenis!=='Pemasukan'),inc=rows.filter(r=>r.jenis==='Pemasukan'),sum=a=>a.reduce((s,r)=>s+r.jumlah,0);
const hari=sum(ex.filter(r=>r.tanggal===td)),mo=sum(ex),im=sum(inc);$('#td').textContent=rp(hari);$('#mo').textContent=rp(mo);$('#in').textContent=rp(im);$('#sl').textContent=rp(im-mo);
const by={};ex.forEach(r=>by[r.kategori]=(by[r.kategori]||0)+r.jumlah);
$('#cats').innerHTML=CATS.map(c=>{const v=by[c]||0,b=bud[c]||0,p=b?v/b:0,cl=p>=1?'bad':p>=.8?'warn':'';return `<div class="cat" data-c="${c}"><div class="row"><span>${c}</span><b>${rp(v)}${b?' / '+rp(b):''}</b></div><div class="bar"><i class="${cl}" style="width:${b?Math.min(p*100,100):(mo?v/mo*100:0)}%"></i></div>${p>=1?'<small class="bad">Melebihi budget</small>':p>=.8?'<small class="warn">Hampir habis</small>':''}</div>`}).join('');
$('#list').innerHTML=rows.filter(r=>r.tanggal===td).reverse().map(r=>`<div class="row it"><div><b>${esc(r.nama)}</b><small>${esc(r.jam)} · ${esc(r.kategori)}</small></div><b class="${r.jenis==='Pemasukan'?'pos':''}">${r.jenis==='Pemasukan'?'+':''}${rp(r.jumlah)}</b></div>`).join('')||'<p class="mut">Belum ada transaksi hari ini</p>'}
$('#cats').onclick=e=>{const c=e.target.closest('.cat')?.dataset.c;if(!c)return;const v=prompt('Budget bulanan '+c+' (Rp, kosongkan untuk hapus)',bud[c]||'');if(v===null)return;v?bud[c]=+v:delete bud[c];localStorage.bud=JSON.stringify(bud);render()};
$('#cfg').onclick=setup;$('[name=kat]').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('#fab').onclick=()=>{$('[name=tgl]').value=ymd(new Date());$('#f').showModal()};
$('#f').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};
$('#f form').onsubmit=async e=>{const d=new FormData(e.target),t={tanggal:d.get('tgl'),jam:new Date().toTimeString().slice(0,5),nama:d.get('nama')||d.get('kat'),kategori:d.get('kat'),jumlah:+d.get('jml'),jenis:d.get('jenis'),token:cfg.token};
rows.push(t);render();e.target.reset();try{await fetch(cfg.url,{method:'POST',body:JSON.stringify(t)});toast('Tersimpan');load()}catch(x){rows.pop();render();toast('Gagal menyimpan, coba lagi')}};
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
$('#scan').onclick=()=>$('#img').click();
$('#img').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast('Membaca struk…');try{const image=await shrink(f),r=await(await fetch(cfg.url,{method:'POST',body:JSON.stringify({action:'scan',token:cfg.token,image})})).json();if(!r.ok)throw r.error;const d=r.data,F=$('#f form');F.jml.value=parseInt(String(d.total).replace(/\D/g,''))||'';F.nama.value=[d.toko,d.items].filter(Boolean).join(' – ');if(CATS.includes(d.kategori))F.kat.value=d.kategori;if(/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal))F.tgl.value=d.tanggal;toast('Cek hasilnya, lalu Simpan')}catch(x){toast('Gagal scan: '+(x||'coba lagi'))}e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');load();
</script></body></html>
